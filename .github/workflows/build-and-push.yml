name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  pull_request:
    branches:
      - main
      - develop

  # Ejecutar después del workflow de migraciones
  workflow_run:
    workflows: ["Flyway Database Migrations"]
    types:
      - completed
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: apptolast/invernaderos-api

jobs:
  # Job de tests: actúa como gate antes del build de Docker.
  # Necesario para que SQL drift y otros bugs no lleguen a prod (ver PR-CI:
  # historico-de-alertas + plan en docs/architecture/ — si el job falla,
  # no se sube imagen).
  # NOT workflow_run: el flujo de migraciones no requiere re-ejecutar tests
  # del codigo; el commit ya pasó por test cuando se merged.
  test:
    name: Run gradle tests
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'pull_request') ||
        (github.event_name == 'workflow_dispatch')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run gradle test
        env:
          INVERNADEROS_TEST_DB_PASSWORD: ${{ secrets.INVERNADEROS_TEST_DB_PASSWORD }}
        run: ./gradlew compileKotlin compileTestKotlin test --warning-mode=all --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  # Job para verificar si las migraciones se completaron correctamente
  check-migrations:
    name: Check Migration Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check migration workflow result
        id: check
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Migrations completed successfully, proceeding with build"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "❌ Migrations failed, skipping build"
          fi

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Build only if tests passed (or were skipped because not applicable, e.g. workflow_run from migrations).
    # Migrations branch (workflow_run) keeps its existing gate via check-migrations.
    needs: [test, check-migrations]
    if: |
      always() && (
        (needs.test.result == 'success' || needs.test.result == 'skipped')
      ) && (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'pull_request') ||
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'workflow_run' && needs.check-migrations.outputs.should_build == 'true')
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For main branch: tag as 'latest', 'main', and git sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # For develop branch: tag as 'develop'
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # Always tag with git short sha
            type=sha,prefix=,format=short
            # Optionally tag with semver if tag is pushed
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build-and-push.outputs.digest }}"

      - name: Summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
