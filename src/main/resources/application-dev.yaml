# =============================================================================
# PERFIL DEV - Configuración para desarrollo local y entorno de desarrollo
# =============================================================================
# Activar con: --spring.profiles.active=dev
# O variable de entorno: SPRING_PROFILES_ACTIVE=dev
# =============================================================================

# Flyway: Auto-migrate habilitado para desarrollo rápido
flyway:
  auto-migrate: true

spring:
  jpa:
    open-in-view: true

# Simulación habilitada para desarrollo sin sensores físicos
greenhouse:
  simulation:
    enabled: true

# Logging más detallado para debugging
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    org.springdoc.core.events.SpringDocAppInitializer: ERROR
    com.apptolast.invernaderos: DEBUG

# WS payload dump activado en dev: cada delivery imprime el JSON entero
# (truncado a 16 KB) en logs con marker WS_PAYLOAD. Útil para verificar
# desde Dozzle qué viaja exactamente a cada cliente sin tener que pinchar
# wireshark sobre el WS.
invernaderos:
  websocket:
    log-payload: true
